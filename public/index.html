<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buku Kas Banjar</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f4;color:#172e29;font:16px "DM Sans",system-ui,sans-serif}header{background:#123e35;color:white;padding:0 max(5vw,20px);display:flex;align-items:center;gap:48px;min-height:72px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}.mark{display:grid;place-items:center;width:35px;height:35px;background:#ddebaa;color:#143e35;border-radius:9px;font-size:23px}nav{display:flex;gap:4px}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:11px 16px;font-weight:650;background:#e9eeeb;color:#20493f}nav button{background:transparent;color:#ccdad4;font-size:14px}nav .on{background:#2c544a;color:white}main{max-width:1330px;margin:auto;padding:40px 5vw}h1,h2,h3,p{margin:0}h1{font-size:clamp(30px,4vw,48px);letter-spacing:-.055em}h2{font-size:21px;letter-spacing:-.035em}small,.muted{color:#576b62}.heading,.panelhead,.line{display:flex;align-items:center;justify-content:space-between;gap:14px}.heading{margin-bottom:24px}.primary{background:#174d40;color:white}.cards{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px}.card,.panel{background:white;border:1px solid #d6dfd8;border-radius:15px;padding:24px}.card:first-child{background:#164c3e;color:white;position:relative;overflow:hidden}.card:first-child:after{content:'';position:absolute;width:105px;height:105px;border:1px solid #49715f;border-radius:50%;right:-50px;bottom:-50px;box-shadow:0 0 0 16px #ffffff07,0 0 0 32px #ffffff07}.card strong{display:block;font-size:clamp(22px,2.7vw,38px);letter-spacing:-.055em;margin:12px 0}.card span{font-size:14px}.card:first-child small{color:#d0e2d7}.split{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin:18px 0}.panelhead{margin-bottom:18px}.panelhead button{font-size:14px}.row{padding:13px 0;border-top:1px solid #e7ede7}.bar{height:8px;background:#edf1ec;border-radius:8px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:#78a894}.bar.gold i{background:#dbb45e}.line span{font-size:14px}.panel{margin-bottom:16px}.split .panel{margin:0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}th,td{padding:14px 10px;border-bottom:1px solid #e4eae5}th{color:#637368;font-weight:550;background:#f5f7f3}td:last-child,th:last-child{text-align:right;white-space:nowrap}.pill{display:inline-block;background:#e8f2eb;border-radius:6px;padding:4px 9px;color:#355c46;font-size:13px}.expense{background:#faf0d9;color:#71541d}dialog{width:min(460px,94vw);border:0;border-radius:16px;color:inherit;padding:26px}dialog::backdrop{background:#102a2370}label{display:grid;gap:5px;margin:13px 0;font-size:14px;font-weight:600}input,select{font:inherit;color:inherit;border:1px solid #acbab0;padding:10px;border-radius:7px;background:white;width:100%}form .line{margin-top:18px}.error{color:#993a26}#status{margin-bottom:12px}.account{margin-left:auto;font-size:14px}.filter{width:auto;max-width:160px}.actions{display:flex;flex-wrap:wrap;gap:8px}@media(max-width:720px){header{flex-wrap:wrap;gap:10px;padding-block:14px}.account{display:none}main{padding:24px 14px}.cards,.split{grid-template-columns:1fr}.card,.panel{padding:16px}.card strong{margin:4px 0}.heading{align-items:flex-start;flex-wrap:wrap}nav button{padding:7px}.panelhead{flex-wrap:wrap}}
</style><header><div class="brand"><span class="mark">▤</span>Buku Kas Banjar</div><nav></nav><span class="account">Kas pimpinan</span><form id="logout" hidden action="/api/auth?action=logout" method="post"><button>Keluar</button></form></header><main><div class="heading"><h1 id="title">Dashboard kas</h1><button id="add" class="primary" disabled>＋ Catat pengeluaran</button></div><div id="status" role="status">Memuat data kas…</div><a id="login" hidden href="/api/auth?action=login">Masuk dengan Google</a><div id="view"></div></main><dialog><form><h2 id="ft"></h2><div id="fields"></div><div class="error" role="alert"></div><div class="line"><button type="button" id="close">Batal</button><button class="primary" id="save">Simpan</button></div></form></dialog><script type="module" src="/app.js"></script></html>
